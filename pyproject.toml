[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-sqlalchemy"
version = "0.0.14"
description = "Opteryx SQLAlchemy Dialect"
requires-python = ">=3.9"
# Keep these floors LOW: this is a library installed into other people's
# environments (Apache Superset 6.x ships SQLAlchemy 1.4 and Python 3.10;
# Superset master pins SQLAlchemy <2.1). Raising a floor to "latest" makes
# the package uninstallable there. 1.4.24 is the first release with
# `_ConnectionFairy.dbapi_connection`, which the dialect relies on.
dependencies = [
    "requests>=2.31",
    "sqlalchemy>=1.4.24",
]

[project.optional-dependencies]
# Only needed for the opt-in `result_format="parquet"` execution option.
# rugo publishes cp311+ manylinux_2_34 wheels only.
parquet = ["rugo>=0.5.8"]

[project.entry-points."sqlalchemy.dialects"]
opteryx = "sqlalchemy_dialect.dialect:OpteryxDialect"

[tool.setuptools]
packages = ["sqlalchemy_dialect"]

[tool.isort]
profile = "black"
extend_skip_glob = ["tests/**"]
skip_gitignore = true
line_length = 100
multi_line_output = 9
force_single_line = true
float_to_top = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py313'

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100
